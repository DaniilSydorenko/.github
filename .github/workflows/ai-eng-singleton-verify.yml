name: AI Engineering Singleton Gate Tests

# Tests only. This workflow has no Cursor/GitHub write permission, tokens,
# dispatch operation, service, job queue, or scheduler.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/initiatives/ai-engineering/github_ref_lease.py'
      - 'docs/initiatives/ai-engineering/test_github_ref_lease.py'
      - 'docs/initiatives/ai-engineering/singleton_admission.py'
      - 'docs/initiatives/ai-engineering/test_singleton_admission.py'
      - 'docs/initiatives/ai-engineering/cursor_readonly.py'
      - 'docs/initiatives/ai-engineering/test_cursor_readonly.py'
      - 'docs/initiatives/ai-engineering/cursor_pr_payload.py'
      - 'docs/initiatives/ai-engineering/test_cursor_pr_payload.py'
      - 'docs/initiatives/ai-engineering/managed_cursor_launch.py'
      - 'docs/initiatives/ai-engineering/test_managed_cursor_launch.py'
      - 'docs/initiatives/ai-engineering/lease_ref_protection.py'
      - 'docs/initiatives/ai-engineering/test_lease_ref_protection.py'
      - '.github/workflows/ai-eng-singleton-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-eng-singleton-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/initiatives/ai-engineering
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run deterministic fail-closed tests only
        run: python3 -m unittest discover -v -p 'test_*.py'

  manual-lease-audit:
    # Owner-triggered observational check only, never launch Cursor/modify refs.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/initiatives/ai-engineering
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Audit live singleton lease ref (expected STOP until protected)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_ENG_APPROVED_WRITER_APP: ${{ vars.AI_ENG_APPROVED_WRITER_APP }}
        run: python3 lease_ref_protection.py
