name: AI Engineering Singleton Gate Tests

# Tests + manually gated read-only owner probes only.
# No lease mutation, Cursor POST, dispatch, service, job queue or scheduler.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/initiatives/ai-engineering/github_ref_lease.py'
      - 'docs/initiatives/ai-engineering/test_github_ref_lease.py'
      - 'docs/initiatives/ai-engineering/singleton_admission.py'
      - 'docs/initiatives/ai-engineering/test_singleton_admission.py'
      - 'docs/initiatives/ai-engineering/cursor_readonly.py'
      - 'docs/initiatives/ai-engineering/test_cursor_readonly.py'
      - 'docs/initiatives/ai-engineering/cursor_pr_payload.py'
      - 'docs/initiatives/ai-engineering/test_cursor_pr_payload.py'
      - 'docs/initiatives/ai-engineering/managed_cursor_launch.py'
      - 'docs/initiatives/ai-engineering/test_managed_cursor_launch.py'
      - 'docs/initiatives/ai-engineering/test_managed_cursor_issue_launch.py'
      - 'docs/initiatives/ai-engineering/test_two_issue_cycle.py'
      - 'docs/initiatives/ai-engineering/lease_ref_protection.py'
      - 'docs/initiatives/ai-engineering/test_lease_ref_protection.py'
      - 'docs/initiatives/ai-engineering/lease_ruleset_candidate.py'
      - 'docs/initiatives/ai-engineering/test_lease_ruleset_candidate.py'
      - 'docs/initiatives/ai-engineering/app_writer_provenance.py'
      - 'docs/initiatives/ai-engineering/test_app_writer_provenance.py'
      - '.github/workflows/ai-eng-singleton-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-eng-singleton-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/initiatives/ai-engineering
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run deterministic fail-closed tests only
        run: python3 -m unittest discover -v -p 'test_*.py'

  manual-lease-audit:
    # Owner-triggered observational check only, never launch Cursor/modify refs.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/initiatives/ai-engineering
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Observe two-ruleset personal-repo candidate (not launch authority)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_ENG_APPROVED_WRITER_APP_ID: ${{ vars.AI_ENG_APPROVED_WRITER_APP_ID }}
        run: python3 lease_ruleset_candidate.py
      - name: Audit live singleton lease ref (expected STOP until protected)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_ENG_APPROVED_WRITER_APP: ${{ vars.AI_ENG_APPROVED_WRITER_APP }}
        run: python3 lease_ref_protection.py

  owner-app-credential-probe:
    # Strictly MANUAL + default-branch + owner + owner-controlled opt-in.
    # Read-only GitHub installation token, revoked after job; no lease mutation.
    # Do not set opt-in until environment protection & dedicated App are reviewed.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main' &&
      vars.AI_ENG_WRITER_PROBE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: ai-eng-lease-owner
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/initiatives/ai-engineering
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Mint single-repository read-scoped installation token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AI_ENG_WRITER_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_ENG_WRITER_APP_PRIVATE_KEY }}
          repositories: .github
          permission-contents: read
      - name: Observe credential identity and effective repository token scope
        env:
          AI_ENG_APP_PROBE_TOKEN: ${{ steps.app.outputs.token }}
          AI_ENG_WRITER_APP_ID: ${{ vars.AI_ENG_WRITER_APP_ID }}
          AI_ENG_WRITER_APP_SLUG: ${{ vars.AI_ENG_WRITER_APP_SLUG }}
          AI_ENG_MINTED_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          AI_ENG_MINTED_INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
        run: python3 app_writer_provenance.py
