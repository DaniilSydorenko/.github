name: AI Engineering Issue 216 Offline Integration Contract

on:
  pull_request:
    paths:
      - 'docs/initiatives/ai-engineering/issue216_integration_contract.py'
      - 'docs/initiatives/ai-engineering/issue216_publisher_boundary_test.py'
      - 'docs/initiatives/ai-engineering/openhands_draft_publisher.py'
      - '.github/workflows/ai-eng-issue216-contract.yml'
      - 'docs/initiatives/ai-engineering/openhands_164_patch_contract.py'
      - 'docs/initiatives/ai-engineering/openhands_runner_admission_bridge.py'
      - 'docs/initiatives/ai-engineering/openhands_lease_admission_adapter.py'
      - 'docs/initiatives/ai-engineering/openhands_164_lease_preconditions.py'
      - 'docs/initiatives/ai-engineering/openhands_164_sequential_handoff.py'
      - 'docs/initiatives/ai-engineering/openhands_live_orchestrator.py'
      - 'docs/initiatives/ai-engineering/github_ref_lease.py'
      - 'docs/initiatives/ai-engineering/lease_ruleset_candidate.py'
      - 'docs/initiatives/ai-engineering/openhands_164_vertical_integration.py'
      - 'docs/initiatives/ai-engineering/test_openhands_164_vertical_integration.py'
      - 'docs/initiatives/ai-engineering/openhands_164_executor.py'
      - 'docs/initiatives/ai-engineering/openhands_164_draft_publisher.py'
      - 'docs/initiatives/ai-engineering/openhands_164_live_wiring.py'
      - 'docs/initiatives/ai-engineering/test_openhands_164_live_wiring.py'
      - 'docs/initiatives/ai-engineering/openhands_164_issue_preflight.py'
      - 'docs/initiatives/ai-engineering/openhands_164_live_runner.py'
      - 'docs/initiatives/ai-engineering/openhands_164_lease_session.py'
      - 'docs/initiatives/ai-engineering/openhands_164_budget_attestation.py'
      - 'docs/initiatives/ai-engineering/openhands_164_ci_evidence.py'
      - 'docs/initiatives/ai-engineering/test_openhands_164_live_runner.py'
      - '.github/workflows/ai-eng-164-protected-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: docs/initiatives/ai-engineering
    steps:
      - name: Checkout HQ
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Offline integration contract
        run: |
          set -euo pipefail
          python3 issue216_integration_contract.py
          python3 issue216_publisher_boundary_test.py
          python3 -m unittest -q test_openhands_164_vertical_integration.py
          python3 -m unittest -q test_openhands_164_live_wiring.py
          python3 openhands_164_vertical_integration.py
          python3 openhands_164_executor.py --self-test
          python3 openhands_164_draft_publisher.py
          python3 openhands_164_live_wiring.py
          python3 openhands_164_issue_preflight.py
          python3 openhands_164_live_runner.py --self-test
          python3 openhands_164_budget_attestation.py
          python3 openhands_164_ci_evidence.py
          python3 -m unittest -q test_openhands_164_live_runner.py
