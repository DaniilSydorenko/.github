name: AI Engineering Issue 216 Offline Integration Contract

on:
  pull_request:
    paths:
      - 'docs/initiatives/ai-engineering/issue216_integration_contract.py'
      - '.github/workflows/ai-eng-issue216-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout HQ
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Offline integration contract
        run: python3 docs/initiatives/ai-engineering/issue216_integration_contract.py
