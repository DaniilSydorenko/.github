name: AI Engineering Haversine 220 Protected Cursor Dispatch

# Owner workflow_dispatch only. Gates-only audit by default; no Cursor POST and
# no lease mutation. Supersedes OpenHands execution path for Issue #220 pilot.
on:
  workflow_dispatch:
    inputs:
      execute_cursor:
        description: 'Reserved; live POST remains blocked while PILOT_ACTIVATION_ENABLED is False'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Shared with every workflow that can start a paid agent or write the lease.
concurrency:
  group: ai-eng-single-live-executor
  cancel-in-progress: false

jobs:
  protected-cursor-gates:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: ai-eng-lease-owner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Bind the audited code to the exact dispatched revision, not a moving branch.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Protected Cursor dispatch gates (Issue #220)
        env:
          AI_ENG_APPROVED_OPERATION: pilot-cursor-220-dispatch-gates-only
          AI_ENG_OWNER_GO_ISSUE: "220"
          AI_ENG_EXECUTE_CURSOR: ${{ inputs.execute_cursor }}
          # GET-only inventory, /v1/models and /v1/me. No POST client exists while
          # PILOT_ACTIVATION_ENABLED is False (enforced in code, tested).
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          # Owner attestations (repository variables, exact value "true").
          AI_ENG_ATTEST_CURSOR_SPEND_LIMIT_SET: ${{ vars.AI_ENG_ATTEST_CURSOR_SPEND_LIMIT_SET }}
          AI_ENG_ATTEST_NO_EXTERNAL_BILLING: ${{ vars.AI_ENG_ATTEST_NO_EXTERNAL_BILLING }}
          AI_ENG_ATTEST_SUBAGENTS_DISABLED: ${{ vars.AI_ENG_ATTEST_SUBAGENTS_DISABLED }}
          AI_ENG_ATTEST_SINGLE_LAUNCH_ROUTE: ${{ vars.AI_ENG_ATTEST_SINGLE_LAUNCH_ROUTE }}
          AI_ENG_ATTEST_TARGET_BRANCH_PROTECTED: ${{ vars.AI_ENG_ATTEST_TARGET_BRANCH_PROTECTED }}
          AI_ENG_ATTEST_CURSOR_KEY_ACCOUNT_SCOPE: ${{ vars.AI_ENG_ATTEST_CURSOR_KEY_ACCOUNT_SCOPE }}
        run: |
          set -euo pipefail
          python3 docs/initiatives/ai-engineering/cursor_protected_dispatch.py --self-test
          python3 docs/initiatives/ai-engineering/openhands_issue_contract.py --self-test
          result="$(python3 docs/initiatives/ai-engineering/cursor_protected_dispatch.py --gates-only)"
          echo "$result" | tee cursor220-gates.json
          python3 - <<'PY'
          import json, os
          with open("cursor220-gates.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["decision"] == "STOP", payload["decision"]
          assert payload["live_cursor_dispatch_authorized"] is False
          assert payload["cursor_post_attempted"] is False
          lines = [
              "### Cursor #220 dispatch gates",
              f"- reason: `{payload['reason']}`",
              f"- request id: `{payload.get('request_id')}`",
              f"- missing evidence: `{payload.get('permit_missing_evidence')}`",
              f"- cursor inventory: `{(payload.get('cursor_inventory') or {}).get('status')}`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          print("PASS: fail-closed STOP, no Cursor POST:", payload["reason"])
          PY
