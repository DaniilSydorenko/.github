name: Autopilot Help Signal

on:
  workflow_run:
    workflows:
      - "GRS Control Plane"
    # Health inspection is default-branch-only. PR completions cannot change its signal.
    # Keep immediate checks for main and the existing scheduled fallback.
    branches: [main]
    types: [completed]
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: autopilot-help-signal
  cancel-in-progress: true

jobs:
  help:
    uses: DaniilSydorenko/.github/.github/workflows/reusable-autopilot-health.yml@main
