name: GRS Control Plane

on:
  pull_request:
    paths:
      - "governance/**"
      - "grs/**"
      - "workflow-templates/**"
      - ".github/workflows/grs-control-plane.yml"
      - ".github/workflows/reusable-autopilot-health.yml"
  push:
    branches: [main]
    paths:
      - "governance/**"
      - "grs/**"
      - "workflow-templates/**"
      - ".github/workflows/grs-control-plane.yml"
      - ".github/workflows/reusable-autopilot-health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grs-control-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validator:
    name: Test GRS control plane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run validator and repository-audit tests
        run: python3 -m unittest discover -s grs/tests -p "test_*.py" -v
      - name: Validate profile pilot manifest
        run: python3 grs/validator.py grs/pilots/DaniilSydorenko.repository.json
      - name: Validate Haversine pilot manifest
        run: python3 grs/validator.py grs/pilots/haversine-geolocation.repository.json
      - name: Validate Engineering Labs pilot manifest
        run: python3 grs/validator.py grs/pilots/engineering-labs.repository.json
      - name: Validate Engineering Handbook pilot manifest
        run: python3 grs/validator.py grs/pilots/engineering-handbook.repository.json
      - name: Validate Career Intelligence pilot manifest
        run: python3 grs/validator.py grs/pilots/career-intelligence.repository.json
