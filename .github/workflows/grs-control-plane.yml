name: GRS Control Plane

on:
  pull_request:
    paths:
      - "governance/**"
      - "grs/**"
      - "workflow-templates/**"
      - ".github/workflows/grs-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "governance/**"
      - "grs/**"
      - "workflow-templates/**"
      - ".github/workflows/grs-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validator:
    name: Test GRS validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run validator tests
        run: python3 -m unittest discover -s grs/tests -p "test_*.py" -v
      - name: Validate profile pilot manifest
        run: python3 grs/validator.py grs/pilots/DaniilSydorenko.repository.json
