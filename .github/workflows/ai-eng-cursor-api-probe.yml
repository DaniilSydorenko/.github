name: AI Engineering Cursor API Read-Only Probe

# No cron, no API POST, no model inference, no lease or repository write.
# Owner workflow_dispatch read-only preflight; needs no deployment approval.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/initiatives/ai-engineering/cursor_api_probe.py'
      - 'docs/initiatives/ai-engineering/test_cursor_api_probe.py'
      - '.github/workflows/ai-eng-cursor-api-probe.yml'
      - 'docs/initiatives/ai-engineering/cursor_delivery_cycle.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-eng-cursor-api-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/initiatives/ai-engineering
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify GET-only probe without API calls
        run: python3 -m unittest -v test_cursor_api_probe test_cursor_readonly

  manual-probe:
    # Owner-free read-only preflight (no deployment approval). Environment
    # cursor-readonly-preflight: deployment branches = main only, NO required
    # reviewers, holds only an environment-scoped CURSOR_API_KEY. It must never
    # hold the lease-writer App key, ruleset token or owner attestations; those
    # stay in the reviewer-gated ai-eng-lease-owner environment. This job mints
    # no App token, so it cannot write the lease, and the read-only code path
    # builds no Cursor POST client (cursor_delivery_cycle.readonly_preflight).
    environment: cursor-readonly-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    # The account-wide inventory GETs the latest run of every non-archived
    # agent (282 agents took ~5 min in run 46071637894).
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs/initiatives/ai-engineering
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read-only admission preflight (GitHub + Cursor GET only)
        env:
          AI_ENG_APPROVED_OPERATION: cursor-readonly-preflight
          AI_ENG_OWNER_GO_ISSUE: ''  # empty = evaluate the head of the owner queue (#226)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          set +e
          python3 cursor_delivery_cycle.py preflight | tee result.json
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          import json, os
          r = json.load(open("result.json"))
          g = r.get("gates") or {}
          ev = g.get("cursor_provider_evidence") or {}
          inv = r.get("cursor_inventory_observed") or {}
          lines = ["### Cursor read-only preflight (no approval, no POST, no lease write)",
                   f"- outcome: `{r.get('outcome')}` reason: `{r.get('reason') or g.get('reason')}`",
                   f"- lease: `{r.get('lease_phase')}` revision `{r.get('lease_revision')}`",
                   f"- key_info_ok: `{ev.get('key_info_ok')}` pinned model `{ev.get('pinned_model')}` offered: `{ev.get('pinned_model') in (ev.get('live_model_ids') or [])}`",
                   f"- cursor inventory (observation): `{inv.get('status')}` `{inv.get('reason')}`",
                   f"- missing (non-attestation): `{g.get('missing_excluding_attestations')}`",
                   f"- attestation-gated (privileged run only): `{g.get('attestation_gated_items')}`"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PY
          exit "$status"
