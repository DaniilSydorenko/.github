name: AI Engineering OpenHands #164 Protected Pilot

# Owner workflow_dispatch only. Documentation pilot #217/#226 or registered multifile code task after accepted #226.
on:
  workflow_dispatch:
    inputs:
      task_kind:
        description: 'documentation pilot or registered multifile TypeScript code task'
        required: true
        type: choice
        options:
          - documentation
          - code
        default: documentation
      issue:
        description: 'Haversine documentation pilot issue (217 or 226)'
        required: true
        type: choice
        options:
          - '217'
          - '226'
      code_task_issue:
        description: 'Open Haversine issue number listed in TRUSTED_CODE_TASKS (code mode only)'
        type: string
        required: false
      recover_run9:
        description: 'Release rejected Run 9 only; no model execution'
        type: boolean
        default: false
      accept_run11:
        description: 'Release accepted merged PR 230; no model execution'
        type: boolean
        default: false
      accepted_head:
        description: 'Exact owner-approved merged PR HEAD for acceptance'
        type: string
        required: false
      execute_model:
        description: 'False: isolated audit only; true: audit then live pilot'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-eng-164-single-live-executor
  cancel-in-progress: false

jobs:
  protected-audit:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      ((inputs.task_kind == 'documentation' && (inputs.issue == '217' || inputs.issue == '226')) ||
       (inputs.task_kind == 'code' && inputs.code_task_issue != ''))
    runs-on: ubuntu-latest
    environment: ai-eng-lease-owner
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      evidence: ${{ steps.audit.outputs.evidence }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticated G3 audit
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.AI_ENG_RULESET_AUDIT_TOKEN }}
          AI_ENG_WRITER_APP_ID: ${{ vars.AI_ENG_WRITER_APP_ID }}
          AI_ENG_OWNER_GO_ISSUE: ${{ inputs.task_kind == 'code' && inputs.code_task_issue || inputs.issue }}
          AI_ENG_APPROVED_OPERATION: ${{ inputs.task_kind == 'code' && 'pilot-live-164-code-execute' || 'pilot-live-164-execute' }}
        run: python3 docs/initiatives/ai-engineering/openhands_164_production_gates.py --emit-g3
  protected-pilot:
    needs: protected-audit
    if: >-
      inputs.task_kind == 'documentation' &&
      inputs.execute_model && !inputs.recover_run9 && !inputs.accept_run11 &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (inputs.issue == '217' || inputs.issue == '226')
    runs-on: ubuntu-latest
    environment: ai-eng-lease-owner
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/initiatives/ai-engineering/openhands-smoke-requirements.txt
      - name: Install pinned OpenHands SDK (construction + live only)
        if: inputs.execute_model
        run: python -m pip install -r docs/initiatives/ai-engineering/openhands-smoke-requirements.txt
      - uses: actions/checkout@v6
        with:
          repository: DaniilSydorenko/haversine-geolocation
          ref: master
          path: issue217-target
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Prepare pinned target TypeScript declarations
        working-directory: issue217-target
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:types
      # Mint a short-lived installation token; never use the App private key as a GitHub API token.
      # Only the live path needs writer credentials. Missing installation/permissions fails closed.
      - name: Mint HQ lease-writer GitHub App token (live only)
        if: inputs.execute_model
        id: lease-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AI_ENG_WRITER_APP_ID }}
          private-key: ${{ secrets.AI_ENG_WRITER_APP_PRIVATE_KEY }}
          owner: DaniilSydorenko
          repositories: .github
          permission-contents: write
      - name: Shared provider cap attestation (live execute only)
        if: inputs.execute_model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 docs/initiatives/ai-engineering/openrouter_budget_gate.py --live
      - name: Protected #164 inventory, lease, admission, optional live execution
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HAVERSINE_PUBLISH_TOKEN: ${{ secrets.HAVERSINE_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_ENG_G3_EVIDENCE: ${{ needs.protected-audit.outputs.evidence }}
          AI_ENG_LEASE_WRITER_TOKEN: ${{ steps.lease-app.outputs.token }}
          AI_ENG_LEASE_TOKEN: ${{ steps.lease-app.outputs.token }}
          AI_ENG_WRITER_APP_ID: ${{ vars.AI_ENG_WRITER_APP_ID }}
          AI_ENG_APPROVED_OPERATION: pilot-live-164-execute
          AI_ENG_OWNER_GO_ISSUE: ${{ inputs.issue }}
          AI_ENG_LIVE_164_EXECUTE: ${{ inputs.execute_model && '1' || '0' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.execute_model }}" == "true" ]]; then
            python3 docs/initiatives/ai-engineering/openhands_164_live_runner.py --live issue217-target "$AI_ENG_OWNER_GO_ISSUE"
          else
            python3 docs/initiatives/ai-engineering/openhands_164_live_runner.py --gates-only issue217-target "$AI_ENG_OWNER_GO_ISSUE"
          fi
  protected-code-pilot:
    needs: protected-audit
    if: >-
      inputs.task_kind == 'code' &&
      inputs.execute_model && !inputs.recover_run9 && !inputs.accept_run11 &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.code_task_issue != ''
    runs-on: ubuntu-latest
    environment: ai-eng-lease-owner
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/initiatives/ai-engineering/openhands-smoke-requirements.txt
      - name: Install pinned OpenHands SDK (construction + live only)
        if: inputs.execute_model
        run: python -m pip install -r docs/initiatives/ai-engineering/openhands-smoke-requirements.txt
      - uses: actions/checkout@v6
        with:
          repository: DaniilSydorenko/haversine-geolocation
          ref: master
          path: haversine-code-target
          persist-credentials: false
      - name: Mint HQ lease-writer GitHub App token (live only)
        if: inputs.execute_model
        id: lease-app-code
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AI_ENG_WRITER_APP_ID }}
          private-key: ${{ secrets.AI_ENG_WRITER_APP_PRIVATE_KEY }}
          owner: DaniilSydorenko
          repositories: .github
          permission-contents: write
      - name: Shared provider cap attestation (live execute only)
        if: inputs.execute_model
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 docs/initiatives/ai-engineering/openrouter_budget_gate.py --live
      - name: Protected multifile code task (post-#226, lease IDLE rev23)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HAVERSINE_PUBLISH_TOKEN: ${{ secrets.HAVERSINE_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_ENG_G3_EVIDENCE: ${{ needs.protected-audit.outputs.evidence }}
          AI_ENG_LEASE_WRITER_TOKEN: ${{ steps.lease-app-code.outputs.token }}
          AI_ENG_LEASE_TOKEN: ${{ steps.lease-app-code.outputs.token }}
          AI_ENG_WRITER_APP_ID: ${{ vars.AI_ENG_WRITER_APP_ID }}
          AI_ENG_APPROVED_OPERATION: pilot-live-164-code-execute
          AI_ENG_OWNER_GO_ISSUE: ${{ inputs.code_task_issue }}
          AI_ENG_LIVE_164_EXECUTE: ${{ inputs.execute_model && '1' || '0' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ISSUE="${{ inputs.code_task_issue }}"
          if [[ "${{ inputs.execute_model }}" == "true" ]]; then
            python3 docs/initiatives/ai-engineering/openhands_164_live_runner.py --code-live haversine-code-target "$ISSUE"
          else
            python3 docs/initiatives/ai-engineering/openhands_164_live_runner.py --code-gates-only haversine-code-target "$ISSUE"
          fi
  protected-recovery:
    needs: protected-audit
    if: >-
      inputs.recover_run9 && !inputs.execute_model && !inputs.accept_run11 &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.issue == '217'
    runs-on: ubuntu-latest
    environment: ai-eng-lease-owner
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: lease-app
        with:
          app-id: ${{ vars.AI_ENG_WRITER_APP_ID }}
          private-key: ${{ secrets.AI_ENG_WRITER_APP_PRIVATE_KEY }}
          owner: DaniilSydorenko
          repositories: .github
          permission-contents: write
      - name: Verify rejected result and release exact lease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_ENG_LEASE_WRITER_TOKEN: ${{ steps.lease-app.outputs.token }}
          AI_ENG_G3_EVIDENCE: ${{ needs.protected-audit.outputs.evidence }}
          AI_ENG_WRITER_APP_ID: ${{ vars.AI_ENG_WRITER_APP_ID }}
          AI_ENG_OWNER_GO_ISSUE: '217'
        run: python3 docs/initiatives/ai-engineering/openhands_164_recover_run9.py

  protected-acceptance:
    needs: protected-audit
    if: >-
      inputs.accept_run11 && !inputs.execute_model && !inputs.recover_run9 &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'DaniilSydorenko/.github' &&
      github.actor == 'DaniilSydorenko' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (inputs.issue == '217' || inputs.issue == '226')
    runs-on: ubuntu-latest
    environment: ai-eng-lease-owner
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: lease-app
        with:
          app-id: ${{ vars.AI_ENG_WRITER_APP_ID }}
          private-key: ${{ secrets.AI_ENG_WRITER_APP_PRIVATE_KEY }}
          owner: DaniilSydorenko
          repositories: .github
          permission-contents: write
      - name: Verify accepted result and release exact lease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_ENG_LEASE_WRITER_TOKEN: ${{ steps.lease-app.outputs.token }}
          AI_ENG_G3_EVIDENCE: ${{ needs.protected-audit.outputs.evidence }}
          AI_ENG_WRITER_APP_ID: ${{ vars.AI_ENG_WRITER_APP_ID }}
          AI_ENG_OWNER_GO_ISSUE: ${{ inputs.issue }}
          AI_ENG_ACCEPTED_HEAD: ${{ inputs.accepted_head }}
        run: python3 docs/initiatives/ai-engineering/openhands_164_accept.py
