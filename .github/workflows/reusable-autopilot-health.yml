name: Reusable Autopilot Health

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect repository health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"

          active_workflow_ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" --jq '
            [.workflows[]
             | select(.state == "active")
             | .id]
          ')"

          latest_bad_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$default_branch&per_page=100"             | jq --argjson active "$active_workflow_ids" --arg default_branch "$default_branch" '
              [.workflow_runs[]
               | select(.name != "Autopilot Help Signal")
               | select(.name != "Reusable Autopilot Health")
               | select(.head_branch == $default_branch)
               | select(.status == "completed")
               | .workflow_id as $wid
               | select(($active | index($wid)) != null)]
              | group_by(.workflow_id)
              | map(sort_by(.created_at) | reverse | .[0])
              | map(select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required"))
              | length
            ')"

          if [ "$latest_bad_count" -gt 0 ]; then
            echo "## AUTOPILOT HELP REQUEST" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
            echo "latest_bad_workflow_count=$latest_bad_count" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository is asking the Autopilot Manager for attention." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Repository health signal is clear." >> "$GITHUB_STEP_SUMMARY"
