name: Reusable Autopilot Health

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  signal:
    # A PR-origin workflow_run cannot affect default-branch health. Skip its
    # runner entirely, even when a domain caller lacks a branch filter.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Inspect repository health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" | jq -er '.default_branch | select(type == "string" and length > 0)')"

          # The prior global top-100 runs feed could silently evict a failed
          # workflow under heavy Help Signal / CI traffic. Enumerate active
          # workflows once, then inspect the latest COMPLETED default-branch
          # run of each workflow directly (one low-cost GET per workflow).
          workflow_page="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")"
          if ! jq -e '
            (.total_count | type) == "number" and
            (.workflows | type) == "array" and
            (.total_count == (.workflows | length)) and
            all(.workflows[]; (.id | type) == "number" and
              (.state | type) == "string" and (.name | type) == "string")
          ' <<< "$workflow_page" >/dev/null; then
            echo "UNKNOWN: incomplete or malformed workflow inventory; refusing false GREEN" >&2
            exit 1
          fi

          workflow_ids="$(jq -r '
            [.workflows[]
             | select(.state == "active")
             | select(.name != "Autopilot Help Signal")
             | select(.name != "Reusable Autopilot Health")
             | .id] | .[]
          ' <<< "$workflow_page")"

          latest_bad_count=0
          checked_count=0
          while IFS= read -r workflow_id; do
            [ -z "$workflow_id" ] && continue
            checked_count=$((checked_count + 1))
            run_page="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?branch=$default_branch&status=completed&per_page=1")"
            conclusion="$(jq -r --arg branch "$default_branch" '
              if (.workflow_runs | type) != "array" then "UNKNOWN"
              elif (.workflow_runs | length) == 0 then "NONE"
              elif .workflow_runs[0].head_branch != $branch then "UNKNOWN"
              else (.workflow_runs[0].conclusion // "UNKNOWN")
              end
            ' <<< "$run_page")"

            case "$conclusion" in
              failure|timed_out|action_required)
                latest_bad_count=$((latest_bad_count + 1))
                ;;
              success|cancelled|skipped|neutral|NONE)
                ;;
              *)
                echo "UNKNOWN: workflow $workflow_id completion $conclusion; refusing false GREEN" >&2
                exit 1
                ;;
            esac
          done <<< "$workflow_ids"

          if [ "$latest_bad_count" -gt 0 ]; then
            echo "## AUTOPILOT HELP REQUEST" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
            echo "checked_active_workflow_count=$checked_count" >> "$GITHUB_STEP_SUMMARY"
            echo "latest_bad_workflow_count=$latest_bad_count" >> "$GITHUB_STEP_SUMMARY"
            echo "Repository is asking the Autopilot Manager for attention." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Repository health signal is clear; checked_active_workflow_count=$checked_count." >> "$GITHUB_STEP_SUMMARY"
